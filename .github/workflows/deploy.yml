name: Deploy prototype to GitHub Pages

# Builds the Vite bundle and publishes it to GitHub Pages so colleagues can
# open the prototype at https://gardnej.github.io/tool-assembly/.
#
# Runs on every push to main. Also available as a manual "Run workflow" so a
# feature branch can be published on demand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build with project-page base path
        run: npm run build
        env:
          VITE_BASE: /tool-assembly/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
